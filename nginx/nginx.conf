# =========================================================================
# Nginx reverse proxy configuration.
#
# Architecture this implements:
#
#   Internet -> AWS Security Group (80/tcp) -> Nginx :80 -> Spring Boot :8080
#
# Why Nginx sits in front of the app (see README "Nginx" section for detail):
#   - terminates the connection on the standard web port (80) so the JVM
#     never needs to run as root / bind to a privileged port
#   - centralizes access/error logging
#   - can add TLS, caching, or a second backend later without touching the
#     Java app
# =========================================================================

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Basic, low-risk security headers - not a substitute for HTTPS/TLS,
    # which is covered as an advanced extension in the README.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # "app" resolves via Docker's embedded DNS to the app container on the
    # shared "valorant-net" network (see docker-compose.yml). On a bare
    # systemd deployment this would instead be 127.0.0.1:8080.
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Dedicated location so `curl http://<host>/health` works the same way
    # whether you hit the app directly or through Nginx.
    location /health {
        proxy_pass http://app:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
